<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<script src="./data.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:20px;max-width:1440px;margin:0 auto;font-family:Inter,system-ui,sans-serif;color:#fff">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div><h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.025em">Genres & Moods</h1><div style="margin-top:6px;font-size:15px;color:#8FA3BF">Order here is the order shown in the app. Drag rows to reorder.</div></div>
    <button onClick="{{ openAdd }}" style="all:unset;cursor:pointer;height:42px;padding:0 20px;border-radius:21px;background:#0A9BFF;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px" style-hover="background:#2AAAFF"><span class="material-symbols-rounded" style="font-size:20px">add</span>Add {{ addLabel }}</button>
  </div>
  <div style="display:flex;gap:4px;padding:4px;border-radius:24px;background:rgba(15,35,64,.6);border:1px solid rgba(255,255,255,.08);align-self:flex-start">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.pick }}" style="all:unset;cursor:pointer;height:36px;padding:0 16px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;background:{{ t.bg }};color:{{ t.color }}"><span class="material-symbols-rounded" style="font-size:18px">{{ t.icon }}</span>{{ t.label }}<span style="font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.12)">{{ t.n }}</span></button></sc-for>
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px;align-items:start">
    <div style="border-radius:24px;background:rgba(15,35,64,.55);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);padding:8px">
      <sc-for list="{{ list }}" as="g" hint-placeholder-count="6">
        <div draggable="true" onDragStart="{{ g.dragStart }}" onDragOver="{{ g.over }}" onDrop="{{ g.drop }}" onDragEnd="{{ dragEnd }}" style="display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px;background:{{ g.bg }};border-top:2px solid {{ g.line }}" style-hover="background:rgba(255,255,255,.03)">
          <span class="material-symbols-rounded" style="font-size:20px;color:#5E7290;cursor:grab">drag_indicator</span>
          <span style="width:22px;font-size:12.5px;font-weight:700;color:#5E7290;font-variant-numeric:tabular-nums">{{ g.n }}</span>
          <div style="width:64px;height:48px;border-radius:12px;background:{{ g.art }};flex:none;position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:{{ g.color }};mix-blend-mode:color;opacity:.55"></div></div>
          <span style="width:14px;height:14px;border-radius:50%;background:{{ g.color }};flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)"></span>
          <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">{{ g.name }}</div><div style="font-size:12.5px;color:#8FA3BF">{{ g.count }} {{ unit }}</div></div>
          <button onClick="{{ g.edit }}" style="all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8FA3BF" style-hover="background:rgba(255,255,255,.06);color:#fff"><span class="material-symbols-rounded" style="font-size:19px">edit</span></button>
          <button onClick="{{ g.remove }}" style="all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8FA3BF" style-hover="background:rgba(240,82,82,.14);color:#F38A8A"><span class="material-symbols-rounded" style="font-size:19px">delete</span></button>
        </div>
      </sc-for>
    </div>
    <div style="border-radius:24px;background:rgba(15,35,64,.55);border:1px solid rgba(255,255,255,.08);padding:20px">
      <div style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#5E7290;margin-bottom:14px">HOW IT LOOKS IN THE APP</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <sc-for list="{{ list }}" as="g" hint-placeholder-count="4">
          <div style="aspect-ratio:16/10;border-radius:16px;background:{{ g.art }};position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)">
            <div style="position:absolute;inset:0;background:linear-gradient(135deg, {{ g.color }}, transparent 75%);opacity:.75"></div>
            <div style="position:absolute;left:12px;bottom:10px;font-size:15px;font-weight:800">{{ g.name }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <sc-if value="{{ modal }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:100;background:rgba(2,6,14,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px">
      <div onClick="{{ stop }}" style="width:480px;max-width:100%;border-radius:28px;background:#0E2240;border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 80px rgba(0,0,0,.6);padding:26px;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:center"><div style="flex:1;font-size:20px;font-weight:800">{{ modalTitle }}</div><button onClick="{{ close }}" style="all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8FA3BF"><span class="material-symbols-rounded">close</span></button></div>
        <div style="aspect-ratio:16/7;border-radius:18px;background:{{ fArt }};position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:14px">
          <div style="position:absolute;inset:0;background:linear-gradient(135deg, {{ fColor }}, transparent 75%);opacity:.75"></div>
          <div style="position:relative;font-size:22px;font-weight:800">{{ fNamePreview }}</div>
          <button onClick="{{ shuffleCover }}" style="all:unset;cursor:pointer;position:relative;height:32px;padding:0 12px;border-radius:16px;background:rgba(5,11,22,.7);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px"><span class="material-symbols-rounded" style="font-size:16px">upload</span>Upload cover</button>
        </div>
        <label style="display:flex;flex-direction:column;gap:7px"><span style="font-size:12px;font-weight:600;color:#8FA3BF">Name</span><input value="{{ fName }}" onChange="{{ setName }}" placeholder="e.g. Afro-house" style="height:46px;border-radius:14px;background:rgba(5,11,22,.4);border:1px solid rgba(255,255,255,.1);padding:0 14px;font-size:15px;color:#fff;outline:none" style-focus="border-color:#0A9BFF;box-shadow:0 0 0 3px rgba(10,155,255,.2)"></label>
        <div><div style="font-size:12px;font-weight:600;color:#8FA3BF;margin-bottom:8px">Color</div><div style="display:flex;gap:10px"><sc-for list="{{ swatches }}" as="c"><button onClick="{{ c.pick }}" style="all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:{{ c.v }};box-shadow:{{ c.ring }}"></button></sc-for></div></div>
        <div style="display:flex;justify-content:flex-end;gap:10px"><button onClick="{{ close }}" style="all:unset;cursor:pointer;height:44px;padding:0 20px;border-radius:22px;font-size:14px;font-weight:600;color:#C9D6E8">Cancel</button><button onClick="{{ save }}" style="all:unset;cursor:pointer;height:44px;padding:0 22px;border-radius:22px;font-size:14px;font-weight:700;background:#0A9BFF">Save</button></div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'music', data: null, modal: null, form: null, over: null };
  componentDidMount() { if (!window.IW) this._w = setInterval(() => { if (window.IW) { clearInterval(this._w); this.forceUpdate(); } }, 40); }
  componentWillUnmount() { clearInterval(this._w); }
  renderVals() {
    const IW = window.IW; if (!IW) return {};
    const s = this.state, toast = this.props.toast || (() => {});
    const data = s.data || IW.genres, list = data[s.tab];
    const set = l => this.setState({ data: { ...data, [s.tab]: l } });
    const sw = ['#0A9BFF', '#18C6D8', '#4F86C6', '#7A6CFF', '#B783FF', '#2CB58A'];
    const f = s.form || {};
    return {
      tabs: [['music', 'Music genres', 'graphic_eq'], ['films', 'Film genres', 'movie'], ['moods', 'Moods', 'mood']].map(([k, label, icon]) => ({ label, icon, n: data[k].length, pick: () => this.setState({ tab: k }), bg: s.tab === k ? '#0A9BFF' : 'transparent', color: s.tab === k ? '#fff' : '#9DB0C9' })),
      addLabel: s.tab === 'moods' ? 'mood' : 'genre', unit: s.tab === 'films' ? 'films' : 'tracks',
      list: list.map((g, i) => ({ ...g, n: i + 1, bg: s.over === i ? 'rgba(10,155,255,.08)' : 'transparent', line: s.over === i ? '#0A9BFF' : 'transparent',
        dragStart: () => { this._d = i; }, over: e => { e.preventDefault(); if (s.over !== i) this.setState({ over: i }); },
        drop: e => { e.preventDefault(); const d = this._d; if (d == null) return; const l = [...list]; const [m] = l.splice(d, 1); l.splice(i, 0, m); set(l); this.setState({ over: null }); toast('Order updated', 'info'); },
        edit: () => this.setState({ modal: 'edit', form: { ...g, idx: i } }), remove: () => { set(list.filter((_, j) => j !== i)); toast(`“${g.name}” removed`, 'bad'); } })),
      dragEnd: () => this.setState({ over: null }),
      openAdd: () => this.setState({ modal: 'add', form: { name: '', color: sw[0], art: IW.art(list.length + 3, list.length % 5), count: 0 } }),
      modal: !!s.modal, modalTitle: s.modal === 'edit' ? 'Edit “' + (f.name || '') + '”' : 'New ' + (s.tab === 'moods' ? 'mood' : 'genre'),
      fName: f.name || '', fNamePreview: f.name || 'Name', fColor: f.color || sw[0], fArt: f.art || '#0F2340',
      setName: e => this.setState({ form: { ...f, name: e.target.value } }), shuffleCover: () => this.setState({ form: { ...f, art: IW.art(Math.floor(Math.random() * 12), Math.floor(Math.random() * 5)) } }),
      swatches: sw.map(v => ({ v, ring: v === f.color ? '0 0 0 3px #0E2240, 0 0 0 5px #fff' : 'none', pick: () => this.setState({ form: { ...f, color: v } }) })),
      close: () => this.setState({ modal: null }), stop: e => e.stopPropagation(),
      save: () => { if (!f.name) return; const l = [...list]; if (s.modal === 'edit') l[f.idx] = { ...l[f.idx], name: f.name, color: f.color, art: f.art }; else l.push({ id: 'n' + Date.now(), name: f.name, color: f.color, art: f.art, count: 0 }); set(l); this.setState({ modal: null }); toast(`“${f.name}” saved`, 'ok'); },
    };
  }
}
</script>
</body>
</html>
