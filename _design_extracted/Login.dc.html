<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>html,body{margin:0;background:#050B16;color:#fff;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}input::placeholder{color:#5E7290}a{color:#4DB6FF;text-decoration:none}a:hover{color:#8FD0FF}</style>
</helmet>
<div style="display:flex;min-height:100vh;background:#050B16;font-family:Inter,system-ui,sans-serif;color:#fff">
  <div style="flex:1.25;position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden">
    <div style="flex:1;position:relative;background:#03070F url('./assets/studio-music.png') center 30%/cover no-repeat">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(5,11,22,.15), rgba(5,11,22,.55)), linear-gradient(180deg, rgba(5,11,22,0) 50%, rgba(5,11,22,.7))"></div>
      <div style="position:absolute;left:48px;bottom:32px;display:flex;align-items:center;gap:12px">
        <span class="material-symbols-rounded" style="font-size:22px;color:#0A9BFF">graphic_eq</span>
        <span style="font-size:22px;font-weight:700;letter-spacing:-.01em">Run <span style="color:#0A9BFF">Music</span></span>
      </div>
    </div>
    <div style="height:2px;background:linear-gradient(90deg, rgba(255,255,255,.0), rgba(255,255,255,.6), rgba(255,255,255,0))"></div>
    <div style="flex:1;position:relative;background:#03070F url('./assets/studio-films.png') center 20%/cover no-repeat">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(5,11,22,.15), rgba(5,11,22,.55)), linear-gradient(0deg, rgba(5,11,22,.0) 50%, rgba(5,11,22,.6))"></div>
      <div style="position:absolute;left:48px;top:32px;display:flex;align-items:center;gap:12px">
        <span class="material-symbols-rounded" style="font-size:22px;color:#0A9BFF">movie</span>
        <span style="font-size:22px;font-weight:700;letter-spacing:-.01em">Run <span style="color:#0A9BFF">Films</span></span>
      </div>
      <div style="position:absolute;left:48px;right:48px;bottom:40px;font-size:13px;color:#8FA3BF">© 2026 iWire Media · Internal use only</div>
    </div>
  </div>
  <div style="flex:1;min-width:420px;display:flex;align-items:center;justify-content:center;padding:48px;background:radial-gradient(700px 500px at 0% 0%, rgba(10,155,255,.18), transparent 60%), linear-gradient(180deg,#0B1E3A,#050B16)">
    <div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:50%;background:#0A9BFF;display:flex;align-items:center;justify-content:center;gap:2.5px;box-shadow:0 0 30px rgba(10,155,255,.5)">
          <div style="width:3px;height:10px;border-radius:2px;background:#04101F"></div><div style="width:3px;height:19px;border-radius:2px;background:#04101F"></div><div style="width:3px;height:26px;border-radius:2px;background:#04101F"></div><div style="width:3px;height:14px;border-radius:2px;background:#04101F"></div><div style="width:3px;height:21px;border-radius:2px;background:#04101F"></div><div style="width:3px;height:10px;border-radius:2px;background:#04101F"></div>
        </div>
        <div style="font-weight:800;font-size:24px;letter-spacing:-.02em">iWire <span style="color:#0A9BFF;font-weight:700">Control Room</span></div>
      </div>
      <div>
        <h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.15">Welcome back</h1>
        <p style="margin:10px 0 0;color:#8FA3BF;font-size:15px;line-height:1.5">Sign in to review uploads, curate the app and keep iWire running.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <label style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:13px;font-weight:600;color:#C9D6E8">Email</span>
          <div style="height:50px;border-radius:16px;background:rgba(15,35,64,.7);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:0 16px">
            <span class="material-symbols-rounded" style="font-size:20px;color:#5E7290">mail</span>
            <input value="admin@iwire.app" style="flex:1;background:none;border:0;outline:none;font-size:15px;color:#fff;font-family:inherit">
          </div>
        </label>
        <label style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#C9D6E8">Password</span><a href="#" style="font-size:13px;font-weight:600">Forgot password?</a></div>
          <div style="height:50px;border-radius:16px;background:rgba(15,35,64,.7);border:1.5px solid #0A9BFF;box-shadow:0 0 0 4px rgba(10,155,255,.15);display:flex;align-items:center;gap:10px;padding:0 16px">
            <span class="material-symbols-rounded" style="font-size:20px;color:#5E7290">lock</span>
            <input type="{{ pwType }}" value="studio-ops-2026" style="flex:1;background:none;border:0;outline:none;font-size:15px;color:#fff;font-family:inherit;letter-spacing:.1em">
            <button onClick="{{ togglePw }}" style="all:unset;cursor:pointer;color:#8FA3BF;display:flex"><span class="material-symbols-rounded" style="font-size:20px">{{ pwIcon }}</span></button>
          </div>
        </label>
        <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;color:#C9D6E8;cursor:pointer">
          <span style="width:20px;height:20px;border-radius:6px;background:#0A9BFF;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:16px;color:#fff">check</span></span>Keep me signed in on this device
        </label>
      </div>
      <button onClick="{{ signIn }}" style="all:unset;cursor:pointer;height:52px;border-radius:26px;background:#0A9BFF;color:#fff;font-weight:700;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 30px rgba(10,155,255,.35)" style-hover="background:#2AAAFF">Sign in<span class="material-symbols-rounded" style="font-size:20px">arrow_forward</span></button>
      <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:#5E7290"><span class="material-symbols-rounded" style="font-size:17px">shield_lock</span>Single admin account · Protected by 2-step verification</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: false };
  renderVals() {
    return { pwType: this.state.show ? 'text' : 'password', pwIcon: this.state.show ? 'visibility_off' : 'visibility', togglePw: () => this.setState(s => ({ show: !s.show })), signIn: () => this.props.go && this.props.go('dashboard') };
  }
}
</script>
</body>
</html>
