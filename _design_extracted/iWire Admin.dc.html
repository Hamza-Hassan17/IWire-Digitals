<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<script src="./data.js"></script>
<style>
html,body{margin:0;height:100%;background:#050B16;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
a{color:#4DB6FF;text-decoration:none}a:hover{color:#8FD0FF}
input,textarea,select,button{font-family:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:#5E7290}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
.material-symbols-rounded{font-size:20px;line-height:1;user-select:none}
@keyframes iwEq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes iwToast{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes iwShimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes iwPop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
</style>
</helmet>
<sc-if value="{{ is.login }}" hint-placeholder-val="{{ false }}">
<dc-import name="Login" go="{{ go }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ inApp }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;height:100vh;overflow:hidden;background:radial-gradient(1000px 640px at 0% 0%, rgba(10,155,255,.20), transparent 62%), linear-gradient(180deg,#0B1E3A 0%,#071328 45%,#050B16 100%);color:#fff;font-family:Inter,system-ui,sans-serif">

<aside style="width:{{ sideW }};flex:none;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);background:rgba(5,11,22,.35);backdrop-filter:blur(18px);transition:width .2s ease">
  <div style="height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;flex:none">
    <div style="width:36px;height:36px;border-radius:50%;background:#0A9BFF;display:flex;align-items:center;justify-content:center;gap:2px;flex:none;box-shadow:0 0 24px rgba(10,155,255,.45)">
      <div style="width:2.5px;height:8px;border-radius:2px;background:#04101F"></div><div style="width:2.5px;height:16px;border-radius:2px;background:#04101F"></div><div style="width:2.5px;height:22px;border-radius:2px;background:#04101F"></div><div style="width:2.5px;height:12px;border-radius:2px;background:#04101F"></div><div style="width:2.5px;height:18px;border-radius:2px;background:#04101F"></div><div style="width:2.5px;height:9px;border-radius:2px;background:#04101F"></div>
    </div>
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;line-height:1.1">
        <div style="font-weight:800;font-size:19px;letter-spacing:-.02em">iWire</div>
        <div style="font-size:11px;color:#8FA3BF;font-weight:500;letter-spacing:.06em;text-transform:uppercase">Control Room</div>
      </div>
    </sc-if>
  </div>
  <nav style="flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 12px 16px;display:flex;flex-direction:column;gap:18px">
    <sc-for list="{{ nav }}" as="g" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:10.5px;font-weight:600;letter-spacing:.12em;color:#5E7290;padding:0 12px 6px">{{ g.label }}</div>
        </sc-if>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <button onClick="{{ it.go }}" title="{{ it.label }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;background:{{ it.bg }};color:{{ it.color }};font-size:14px;font-weight:{{ it.weight }};position:relative" style-hover="background:rgba(255,255,255,.05);color:#fff">
            <span class="material-symbols-rounded" style="font-size:21px;font-variation-settings:'FILL' {{ it.fill }};color:{{ it.iconColor }}">{{ it.icon }}</span>
            <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span style="flex:1;white-space:nowrap">{{ it.label }}</span></sc-if>
            <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
              <span style="min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:{{ it.badgeBg }};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;position:{{ badgePos }};top:4px;right:6px">{{ it.badge }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <div style="padding:12px;border-top:1px solid rgba(255,255,255,.06);flex:none">
    <button onClick="{{ toggleSide }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;color:#8FA3BF;font-size:13px;width:100%;box-sizing:border-box" style-hover="background:rgba(255,255,255,.05);color:#fff">
      <span class="material-symbols-rounded" style="font-size:20px">{{ collapseIcon }}</span>
      <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span>Collapse</span></sc-if>
    </button>
  </div>
</aside>

<div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative">
  <header style="height:72px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(5,11,22,.25);backdrop-filter:blur(18px);position:relative;z-index:20">
    <button onClick="{{ openPalette }}" style="all:unset;cursor:pointer;flex:1;max-width:460px;height:42px;border-radius:21px;background:rgba(15,35,64,.6);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;color:#5E7290;font-size:14px;box-sizing:border-box" style-hover="border-color:rgba(10,155,255,.4)">
      <span class="material-symbols-rounded" style="font-size:20px;color:#8FA3BF">search</span>
      <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Search tracks, films, creators, listeners…</span>
      <span style="display:flex;gap:4px"><span style="font-size:11px;font-weight:600;color:#8FA3BF;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)">⌘</span><span style="font-size:11px;font-weight:600;color:#8FA3BF;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)">K</span></span>
    </button>
    <div style="flex:1"></div>
    <div style="display:flex;gap:4px;padding:4px;border-radius:24px;background:rgba(15,35,64,.6);border:1px solid rgba(255,255,255,.08)">
      <sc-for list="{{ ctxOpts }}" as="o" hint-placeholder-count="3">
        <button onClick="{{ o.pick }}" style="all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:{{ o.bg }};color:{{ o.color }}">
          <span class="material-symbols-rounded" style="font-size:18px">{{ o.icon }}</span>{{ o.label }}
        </button>
      </sc-for>
    </div>
    <div style="position:relative">
      <button onClick="{{ toggleNotif }}" style="all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(15,35,64,.6);border:1px solid rgba(255,255,255,.08);position:relative" style-hover="border-color:rgba(255,255,255,.18)">
        <span class="material-symbols-rounded" style="font-size:21px;color:#C9D6E8">notifications</span>
        <span style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#0A9BFF;box-shadow:0 0 0 2px #0B1E3A"></span>
      </button>
      <sc-if value="{{ notif }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:52px;right:0;width:380px;border-radius:20px;background:rgba(12,28,52,.96);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);box-shadow:0 30px 60px rgba(0,0,0,.5);overflow:hidden;animation:iwPop .16s ease">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px">
            <div style="font-weight:700;font-size:15px">Notifications</div>
            <button onClick="{{ toggleNotif }}" style="all:unset;cursor:pointer;font-size:12px;color:#4DB6FF;font-weight:600">Mark all read</button>
          </div>
          <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="4">
            <button onClick="{{ n.go }}" style="all:unset;cursor:pointer;display:flex;gap:12px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.05);width:100%;box-sizing:border-box" style-hover="background:rgba(255,255,255,.04)">
              <div style="width:36px;height:36px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:{{ n.bg }}"><span class="material-symbols-rounded" style="font-size:19px;color:{{ n.color }}">{{ n.icon }}</span></div>
              <div style="flex:1;min-width:0"><div style="font-size:13px;line-height:1.4;color:#E6EEF8">{{ n.text }}</div><div style="font-size:11.5px;color:#5E7290;margin-top:3px">{{ n.time }}</div></div>
              <sc-if value="{{ n.unread }}"><span style="width:7px;height:7px;border-radius:50%;background:#0A9BFF;margin-top:6px;flex:none"></span></sc-if>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <div style="position:relative">
      <button onClick="{{ toggleMenu }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:24px;background:rgba(15,35,64,.6);border:1px solid rgba(255,255,255,.08)">
        <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0A9BFF,#0B3D7A);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">AD</div>
        <span style="font-size:13px;font-weight:600">Admin</span>
        <span class="material-symbols-rounded" style="font-size:18px;color:#8FA3BF">expand_more</span>
      </button>
      <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:52px;right:0;width:240px;border-radius:18px;background:rgba(12,28,52,.96);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);box-shadow:0 30px 60px rgba(0,0,0,.5);padding:8px;animation:iwPop .16s ease">
          <div style="padding:10px 12px 12px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:6px"><div style="font-weight:600;font-size:14px">Platform Admin</div><div style="font-size:12px;color:#8FA3BF">admin@iwire.app</div></div>
          <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="3">
            <button onClick="{{ m.run }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;font-size:13.5px;width:100%;box-sizing:border-box;color:#D5E0EE" style-hover="background:rgba(255,255,255,.06)"><span class="material-symbols-rounded" style="font-size:19px;color:#8FA3BF">{{ m.icon }}</span>{{ m.label }}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </header>

  <main ref="{{ scrollRef }}" style="flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 32px 128px">
    <sc-if value="{{ is.dashboard }}"><dc-import name="Dashboard" ctx="{{ ctx }}" go="{{ go }}" toast="{{ toast }}" play="{{ play }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.queue }}"><dc-import name="ReviewQueue" ctx="{{ ctx }}" go="{{ go }}" toast="{{ toast }}" play="{{ play }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.review }}"><dc-import name="ReviewDetail" param="{{ param }}" go="{{ go }}" toast="{{ toast }}" play="{{ play }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.reports }}"><dc-import name="Reports" ctx="{{ ctx }}" go="{{ go }}" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.library }}"><dc-import name="Library" ctx="{{ ctx }}" param="{{ param }}" go="{{ go }}" toast="{{ toast }}" play="{{ play }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.curation }}"><dc-import name="HomeCuration" ctx="{{ ctx }}" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.genres }}"><dc-import name="Genres" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.listeners }}"><dc-import name="Listeners" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.creators }}"><dc-import name="Creators" ctx="{{ ctx }}" param="{{ param }}" go="{{ go }}" toast="{{ toast }}" play="{{ play }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.comments }}"><dc-import name="Comments" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.push }}"><dc-import name="PushNotifications" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.analytics }}"><dc-import name="Analytics" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.activity }}"><dc-import name="ActivityLog" ctx="{{ ctx }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.settings }}"><dc-import name="Settings" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.components }}"><dc-import name="Components" toast="{{ toast }}" hint-size="100%,900px"></dc-import></sc-if>
  </main>

  <sc-if value="{{ hasPlayer }}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;left:24px;right:24px;bottom:18px;z-index:15;height:76px;border-radius:38px;background:rgba(12,28,52,.82);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;padding:0 14px 0 12px">
    <div style="width:{{ pl.thumbW }};height:52px;border-radius:14px;background:{{ pl.art }};flex:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px"><span class="material-symbols-rounded" style="font-size:14px;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:2px">{{ pl.icon }}</span></div>
    <div style="width:200px;min-width:0;flex:none">
      <div style="font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ pl.title }}</div>
      <div style="font-size:12.5px;color:#8FA3BF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ pl.creator }} · <span style="color:#F5C46B">{{ pl.tag }}</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex:none">
      <button onClick="{{ restart }}" style="all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#C9D6E8" style-hover="background:rgba(255,255,255,.06)"><span class="material-symbols-rounded" style="font-size:22px">replay_10</span></button>
      <button onClick="{{ togglePlay }}" style="all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #0A9BFF;color:#0A9BFF;box-sizing:border-box" style-hover="background:rgba(10,155,255,.12)"><span class="material-symbols-rounded" style="font-size:28px;font-variation-settings:'FILL' 1">{{ playIcon }}</span></button>
      <button onClick="{{ skip }}" style="all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#C9D6E8" style-hover="background:rgba(255,255,255,.06)"><span class="material-symbols-rounded" style="font-size:22px">forward_10</span></button>
    </div>
    <div style="flex:1;min-width:120px;display:flex;align-items:center;gap:12px">
      <span style="font-size:12px;color:#8FA3BF;font-variant-numeric:tabular-nums;width:34px;text-align:right">{{ cur }}</span>
      <div onClick="{{ seek }}" style="flex:1;height:28px;display:flex;align-items:center;gap:2px;cursor:pointer">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="60">
          <div style="flex:1;height:{{ b.h }};border-radius:2px;background:{{ b.c }}"></div>
        </sc-for>
      </div>
      <span style="font-size:12px;color:#8FA3BF;font-variant-numeric:tabular-nums;width:34px">{{ pl.dur }}</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex:none">
      <button onClick="{{ openReview }}" style="all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:18px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px" style-hover="background:rgba(255,255,255,.1)"><span class="material-symbols-rounded" style="font-size:17px">open_in_new</span>Open review</button>
      <span class="material-symbols-rounded" style="font-size:20px;color:#8FA3BF;padding:0 6px">volume_up</span>
      <button onClick="{{ closePlayer }}" style="all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8FA3BF" style-hover="background:rgba(255,255,255,.06);color:#fff"><span class="material-symbols-rounded" style="font-size:19px">close</span></button>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:32px;bottom:112px;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;border-radius:16px;background:rgba(12,28,52,.96);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 40px rgba(0,0,0,.5);animation:iwToast .2s ease;max-width:420px">
      <div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ toastBg }}"><span class="material-symbols-rounded" style="font-size:19px;color:{{ toastFg }};font-variation-settings:'FILL' 1">{{ toastIcon }}</span></div>
      <div style="font-size:13.5px;font-weight:500">{{ toastMsg }}</div>
      <button onClick="{{ hideToast }}" style="all:unset;cursor:pointer;font-size:12.5px;color:#4DB6FF;font-weight:600;margin-left:8px">Undo</button>
    </div>
  </sc-if>
</div>

<sc-if value="{{ palette }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closePalette }}" style="position:fixed;inset:0;z-index:100;background:rgba(2,6,14,.6);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh">
    <div onClick="{{ stop }}" style="width:640px;max-width:calc(100vw - 48px);border-radius:24px;background:rgba(12,28,52,.97);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 80px rgba(0,0,0,.6);overflow:hidden;animation:iwPop .16s ease">
      <div style="display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;border-bottom:1px solid rgba(255,255,255,.07)">
        <span class="material-symbols-rounded" style="font-size:22px;color:#0A9BFF">search</span>
        <input autoFocus="{{ true }}" value="{{ q }}" onChange="{{ setQ }}" placeholder="Type a command or search…" style="flex:1;background:none;border:0;outline:none;font-size:16px;color:#fff">
        <span style="font-size:11px;font-weight:600;color:#8FA3BF;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)">ESC</span>
      </div>
      <div style="max-height:420px;overflow-y:auto;padding:8px">
        <sc-for list="{{ results }}" as="grp" hint-placeholder-count="2">
          <div style="font-size:10.5px;font-weight:600;letter-spacing:.12em;color:#5E7290;padding:10px 12px 6px">{{ grp.label }}</div>
          <sc-for list="{{ grp.items }}" as="r" hint-placeholder-count="4">
            <button onClick="{{ r.run }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;width:100%;box-sizing:border-box" style-hover="background:rgba(10,155,255,.12)">
              <div style="width:30px;height:30px;border-radius:9px;background:{{ r.art }};display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-rounded" style="font-size:18px;color:#C9D6E8">{{ r.icon }}</span></div>
              <span style="flex:1;font-size:14px;font-weight:500">{{ r.label }}</span>
              <span style="font-size:12px;color:#5E7290">{{ r.sub }}</span>
            </button>
          </sc-for>
        </sc-for>
        <sc-if value="{{ noResults }}"><div style="padding:32px;text-align:center;color:#8FA3BF;font-size:14px">No matches for “{{ q }}”</div></sc-if>
      </div>
      <div style="display:flex;gap:18px;padding:10px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#5E7290"><span>↑↓ navigate</span><span>↵ open</span><span>⌘K toggle</span></div>
    </div>
  </div>
</sc-if>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { screen: localStorage.getItem('iw.screen') || 'dashboard', param: localStorage.getItem('iw.param') || null, ctx: 'All', collapsed: false, palette: false, q: '', notif: false, menu: false, toast: null, player: null, playing: false, pos: 0.34, ready: !!window.IW, w: window.innerWidth };
  scrollRef = React.createRef();
  componentDidMount() {
    this._w = setInterval(() => { if (window.IW) { clearInterval(this._w); if (!this.state.player) this.setState({ ready: true, player: { ...window.IW.queue[0] } }); } }, 40);
    this._k = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.setState(s => ({ palette: !s.palette, q: '' })); }
      if (e.key === 'Escape') this.setState({ palette: false, notif: false, menu: false });
    };
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('keydown', this._k); window.addEventListener('resize', this._r);
    this._t = setInterval(() => { if (this.state.playing) this.setState(s => ({ pos: s.pos >= 1 ? 0 : s.pos + 1 / 200 })); }, 1000);
  }
  componentWillUnmount() { clearInterval(this._w); clearInterval(this._t); window.removeEventListener('keydown', this._k); window.removeEventListener('resize', this._r); }
  go = (screen, param) => {
    localStorage.setItem('iw.screen', screen); localStorage.setItem('iw.param', param || '');
    this.setState({ screen, param: param || null, palette: false, notif: false, menu: false });
    if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0;
  };
  toast = (msg, kind) => { clearTimeout(this._tt); this.setState({ toast: { msg, kind: kind || 'ok' } }); this._tt = setTimeout(() => this.setState({ toast: null }), 3200); };
  play = item => this.setState({ player: item, playing: true, pos: 0 });
  renderVals() {
    const s = this.state, IW = window.IW;
    const expanded = !s.collapsed && s.w >= 1100;
    const groups = [
      ['MAIN', [['dashboard', 'Dashboard', 'space_dashboard'], ['queue', 'Review Queue', 'inventory', 12], ['reports', 'Reports & Flags', 'flag', 4]]],
      ['CONTENT', [['library', 'Library', 'video_library'], ['curation', 'Home Curation', 'dashboard_customize'], ['genres', 'Genres & Moods', 'category']]],
      ['PEOPLE', [['listeners', 'Listeners', 'headphones'], ['creators', 'Creators', 'mic_external_on'], ['comments', 'Comments', 'forum']]],
      ['PLATFORM', [['push', 'Push Notifications', 'campaign'], ['analytics', 'Analytics', 'monitoring']]],
      ['SYSTEM', [['activity', 'Activity Log', 'history'], ['settings', 'Settings', 'settings']]],
    ];
    const activeKey = s.screen === 'review' ? 'queue' : s.screen;
    const nav = groups.map(([label, items]) => ({ label, items: items.map(([key, l, icon, badge]) => {
      const a = key === activeKey;
      return { key, label: l, icon, badge: badge || null, badgeBg: key === 'reports' ? '#E2703A' : '#0A9BFF', go: () => this.go(key), bg: a ? 'rgba(10,155,255,.16)' : 'transparent', color: a ? '#fff' : '#9DB0C9', iconColor: a ? '#0A9BFF' : '#8FA3BF', fill: a ? 1 : 0, weight: a ? 600 : 500 };
    }) }));
    const is = {}; ['login','dashboard','queue','review','reports','library','curation','genres','listeners','creators','comments','push','analytics','activity','settings','components'].forEach(k => is[k] = s.screen === k);
    const ctxOpts = [['All', 'apps'], ['Music', 'graphic_eq'], ['Films', 'movie']].map(([label, icon]) => ({ label, icon, pick: () => this.setState({ ctx: label }), bg: s.ctx === label ? '#0A9BFF' : 'transparent', color: s.ctx === label ? '#fff' : '#9DB0C9' }));
    const pl = s.player;
    const plv = pl ? { ...pl, thumbW: pl.type === 'Films' ? '84px' : '52px', icon: pl.type === 'Films' ? 'movie' : 'graphic_eq', tag: pl.status === 'Pending' ? 'In review' : pl.status || 'Live', dur: pl.type === 'Films' ? '1:04:12' : (pl.dur || '3:24') } : {};
    const totalSec = pl ? (pl.type === 'Films' ? 3852 : (() => { const p = (pl.dur || '3:24').split(':'); return (+p[0]) * 60 + (+p[1] || 0); })()) : 200;
    const cs = Math.floor(totalSec * s.pos);
    const fmt = x => x >= 3600 ? Math.floor(x / 3600) + ':' + String(Math.floor(x % 3600 / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0') : Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0');
    const wv = IW ? IW.wave(72, pl ? pl.title.length : 3) : [];
    const bars = wv.map((h, i) => ({ h: Math.max(12, h) + '%', c: i / wv.length < s.pos ? '#0A9BFF' : 'rgba(255,255,255,.16)' }));
    const q = s.q.trim().toLowerCase();
    const screens = [['dashboard','Dashboard','space_dashboard'],['queue','Review Queue','inventory'],['reports','Reports & Flags','flag'],['library','Library','video_library'],['curation','Home Curation','dashboard_customize'],['genres','Genres & Moods','category'],['listeners','Listeners','headphones'],['creators','Creators','mic_external_on'],['comments','Comments','forum'],['push','Push Notifications','campaign'],['analytics','Analytics','monitoring'],['activity','Activity Log','history'],['settings','Settings','settings'],['components','Component sheet','widgets']];
    const results = [];
    const navR = screens.filter(x => !q || x[1].toLowerCase().includes(q)).slice(0, q ? 6 : 5).map(x => ({ icon: x[2], label: 'Go to ' + x[1], sub: 'Navigate', art: 'rgba(255,255,255,.06)', run: () => this.go(x[0]) }));
    if (navR.length) results.push({ label: 'NAVIGATE', items: navR });
    if (IW) {
      const content = [...IW.queue.map(x => ({ ...x, kind: 'q' })), ...IW.tracks, ...IW.films].filter(x => !q || x.title.toLowerCase().includes(q) || x.creator.toLowerCase().includes(q)).slice(0, q ? 6 : 3)
        .map(x => ({ icon: x.type === 'Music' ? 'graphic_eq' : 'movie', label: x.title, sub: x.creator + ' · ' + (x.kind === 'q' ? 'Pending' : x.status), art: x.art, run: () => x.kind === 'q' ? this.go('review', x.id) : this.go('library', x.id) }));
      if (content.length) results.push({ label: 'CONTENT', items: content });
      const cr = IW.creators.filter(x => q && x.name.toLowerCase().includes(q)).slice(0, 3).map(x => ({ icon: x.icon, label: x.name, sub: x.type, art: x.art, run: () => this.go('creators', x.id) }));
      if (cr.length) results.push({ label: 'CREATORS', items: cr });
      if (!q) results.push({ label: 'ACTIONS', items: [{ icon: 'campaign', label: 'Compose push notification', sub: 'Action', art: 'rgba(10,155,255,.16)', run: () => this.go('push') }, { icon: 'publish', label: 'Publish home curation', sub: 'Action', art: 'rgba(10,155,255,.16)', run: () => this.go('curation') }] });
    }
    const notifs = [
      ['inventory', '#6CC4FF', 'rgba(10,155,255,.14)', '3 new submissions in Review Queue', '4 min ago', true, 'queue'],
      ['flag', '#FBA26A', 'rgba(249,128,52,.15)', '“Blue Hour Tape” reported 14 times for copyright', '22 min ago', true, 'reports'],
      ['schedule', '#F5C46B', 'rgba(245,176,65,.14)', '“Neon Psalms” has been waiting over 48 hrs', '1 hr ago', true, 'review'],
      ['mic_external_on', '#5FD99A', 'rgba(52,199,123,.14)', '12 new creators joined this week', '3 hrs ago', false, 'creators'],
      ['campaign', '#A7B4C6', 'rgba(148,163,184,.14)', 'Scheduled push “Weekend premiere” goes out Oct 18', 'Yesterday', false, 'push'],
    ].map(n => ({ icon: n[0], color: n[1], bg: n[2], text: n[3], time: n[4], unread: n[5], go: () => this.go(n[6], n[6] === 'review' ? 'q0' : null) }));
    const t = s.toast;
    const tk = t ? ({ ok: ['check', '#5FD99A', 'rgba(52,199,123,.18)'], bad: ['close', '#F38A8A', 'rgba(240,82,82,.18)'], info: ['info', '#6CC4FF', 'rgba(10,155,255,.18)'] }[t.kind] || ['check', '#5FD99A', 'rgba(52,199,123,.18)']) : [];
    return {
      is, inApp: !is.login, go: this.go, toast: this.toast, play: this.play, ctx: s.ctx, param: s.param,
      expanded, sideW: expanded ? '248px' : '76px', badgePos: expanded ? 'static' : 'absolute', nav, collapseIcon: expanded ? 'left_panel_close' : 'left_panel_open',
      toggleSide: () => this.setState(st => ({ collapsed: !st.collapsed })), ctxOpts,
      openPalette: () => this.setState({ palette: true, q: '' }), closePalette: () => this.setState({ palette: false }), stop: e => e.stopPropagation(),
      palette: s.palette, q: s.q, setQ: e => this.setState({ q: e.target.value }), results, noResults: results.length === 0,
      notif: s.notif, toggleNotif: () => this.setState(st => ({ notif: !st.notif, menu: false })), notifs,
      menu: s.menu, toggleMenu: () => this.setState(st => ({ menu: !st.menu, notif: false })),
      menuItems: [{ icon: 'person', label: 'Profile & settings', run: () => this.go('settings') }, { icon: 'widgets', label: 'Component sheet', run: () => this.go('components') }, { icon: 'logout', label: 'Sign out', run: () => this.go('login') }],
      scrollRef: this.scrollRef,
      hasPlayer: !!pl, pl: plv, playIcon: s.playing ? 'pause' : 'play_arrow', togglePlay: () => this.setState(st => ({ playing: !st.playing })),
      restart: () => this.setState(st => ({ pos: Math.max(0, st.pos - 10 / totalSec) })), skip: () => this.setState(st => ({ pos: Math.min(1, st.pos + 10 / totalSec) })),
      seek: e => { const r = e.currentTarget.getBoundingClientRect(); this.setState({ pos: (e.clientX - r.left) / r.width }); },
      cur: fmt(cs), bars, closePlayer: () => this.setState({ player: null, playing: false }),
      openReview: () => pl && (pl.id || '').startsWith('q') ? this.go('review', pl.id) : this.go('library', pl && pl.id),
      toastOn: !!t, toastMsg: t ? t.msg : '', toastIcon: tk[0], toastFg: tk[1], toastBg: tk[2], hideToast: () => this.setState({ toast: null }),
    };
  }
}
</script>
